<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://date-night.onbuyuka.workers.dev/">
    <meta http-equiv="refresh" content="0; url=https://date-night.onbuyuka.workers.dev/">
    <title>Date Night has moved</title>
    <script>
      const destination = new URL("https://date-night.onbuyuka.workers.dev/");
      destination.search = window.location.search;
      if (window.location.hash.startsWith("#/")) destination.hash = window.location.hash;
      window.location.replace(destination.href);
    </script>
    <style>
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #fcf3f3; color: #45272e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      h1 { font-family: Georgia, serif; font-weight: 500; }
      p { line-height: 1.6; }
      a { color: #9c4059; }
    </style>
  </head>
  <body>
    <main>
      <h1>Date Night has moved.</h1>
      <p>Taking you to your next good plan.</p>
      <p>If nothing happens, <a href="https://date-night.onbuyuka.workers.dev/">open Date Night</a>.</p>
    </main>
  </body>
</html>
